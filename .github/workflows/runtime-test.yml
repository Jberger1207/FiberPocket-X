name: Runtime Test FiberPocket X
on:
  push:
    branches: [ main ]
jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 14 and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.fiberpocket.x/.MainActivity
            sleep 8
            echo '=== PID ==='
            adb shell pidof com.fiberpocket.x || true
            echo '=== RESUMED ACTIVITY ==='
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            echo '=== CRASH LOG ==='
            adb logcat -d -v time | grep -E 'FATAL EXCEPTION|AndroidRuntime|com.fiberpocket.x|chromium' | tail -n 250 || true
            adb exec-out screencap -p > runtime-screen.png || true
            if [ -z "$(adb shell pidof com.fiberpocket.x)" ]; then
              echo 'FiberPocket X process is not running after launch'
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FiberPocket-X-runtime-screen
          path: runtime-screen.png
          if-no-files-found: ignore
